[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.20.2)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="baritoe"
mandatory=true
versionRange="[1.10.5,)"
ordering="AFTER"
side="CLIENT"
